[package]
name = "polymarket_weather_predictor"
version = "1.1.0"
edition = "2021"
description = "Probabilistic forecasting and trading toolkit for weather prediction markets"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
dotenvy = "0.15"
rand = "0.8"
rand_distr = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
approx = "0.5"
