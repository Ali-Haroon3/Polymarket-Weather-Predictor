# Daily forward capture in the cloud — replaces the laptop launchd agent so data accrues even when
# the machine is closed. Targets ~15:00 UTC: the exact capture geometry the per-(city, lead) sigma
# tables in src/stations.rs were fitted at (launchd's 9:00 Denver drifts an hour with DST; this
# doesn't). Scheduled at 14:50, not 15:00 — top-of-hour crons queue behind GitHub's rush and can
# slip badly (the Jul 13 run fired at 16:01); an off-peak minute lands closer to the target hour
# on average. Capture and dashboard touch only anonymous APIs. The kalshi_pilot step is the
# canonical driver in BOTH of its modes: dry by default (no credentials ⇒ ledger-only dedupe,
# paper decisions accrue for the go-live gate), and LIVE — real limit orders — only when the
# repository variable PILOT_LIVE is "1" AND the KALSHI_API_KEY_ID / KALSHI_PRIVATE_KEY_PEM
# secrets are set. The trade host comes from the KALSHI_BASE_URL variable (unset ⇒ the code's
# demo default), so real money needs two explicit settings in the GitHub UI: PILOT_LIVE=1 and
# KALSHI_BASE_URL=https://api.elections.kalshi.com. Neither is a code change, and flipping
# PILOT_LIVE back (or setting the PILOT_DISABLE variable to 1) stands the pilot down next morning.
name: daily-capture

on:
  schedule:
    # Primary, then a backup 37 minutes later. On 2026-08-26 GitHub delivered the schedule five
    # times in twenty minutes and gave none of them a runner (two startup_failure, two failure,
    # one cancelled) — that day captured nothing, and a capture gap is PERMANENT: Polymarket
    # purges price history shortly after a market resolves, so a missed day can never be
    # backfilled. The backup stands down when the day is already committed (see the guard step),
    # so the normal cost is one cheap checkout. 15:27 is still inside the drift this workflow has
    # always tolerated (the Jul 13 run fired at 16:01), so a rescued day is priced at essentially
    # the geometry the sigma/bias tables were fitted at.
    - cron: "50 14 * * *"
    - cron: "27 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Stand down if today is already captured
        id: guard
        # Asks the DATA, not the workflow's own run history: a scheduled run is pinned to the SHA
        # at trigger time, so fast-forward to the branch tip first — that also lands every later
        # step on the newest main instead of racing the commit step against it. The primary run
        # normally finds nothing here; the backup finds today's rows and skips the rest.
        run: |
          git fetch --quiet origin main
          git reset --quiet --hard origin/main
          today=$(date -u +%F)
          if grep -q "\"captured_at\":\"$today\"" data/captures.jsonl; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::captures for $today already committed — standing down"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "no captures for $today yet — proceeding"
          fi

      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.already != 'true'

      - name: Build
        if: steps.guard.outputs.already != 'true'
        run: cargo build --release --bin capture_prices --bin weather_dashboard --bin kalshi_pilot

      - name: Capture prices
        if: steps.guard.outputs.already != 'true'
        # Tolerate transient fetch failures (same contract as scripts/daily_capture.sh): the
        # dashboard still re-renders from the last-good captures.jsonl.
        continue-on-error: true
        run: ./target/release/capture_prices

      - name: Go-live gate readout
        if: steps.guard.outputs.already != 'true'
        # The decision rule (scripts/go_live_gate.py) scored on the ledger as of this morning,
        # printed into every run's log so the verdict travels with the data it was read from.
        # Advisory: it does not gate the step below — arming is a human act (PILOT_LIVE).
        continue-on-error: true
        run: python3 scripts/go_live_gate.py

      - name: Kalshi pilot
        if: steps.guard.outputs.already != 'true'
        # Runs after capture (fresh λ fit and outcomes); tolerates failure so a pilot hiccup can't
        # block the dashboard. Dry by default: every intended order and skip is appended to
        # data/pilot_trades.jsonl — the go-live gate's evidence. With PILOT_LIVE=1 the SAME code
        # path places real limit orders (TTL-bounded, see the pilot's docs), reconciles earlier
        # ones into `fill`/`unfilled` rows, and the commit step below carries the ledger home.
        # One mode per day: the ledger dedupe is mode-scoped, so a dry run must not precede a
        # live one on the same morning. The 15:27 backup re-executes this step only when the
        # primary left no captures for today; a credentialed pilot then dedupes against Kalshi's
        # own resting orders and positions, so a lost commit cannot double-order.
        continue-on-error: true
        env:
          PILOT_LIVE: ${{ vars.PILOT_LIVE }}
          PILOT_DISABLE: ${{ vars.PILOT_DISABLE }}
          KALSHI_BASE_URL: ${{ vars.KALSHI_BASE_URL }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}
        run: |
          if [ "$PILOT_LIVE" = "1" ]; then
            echo "::warning::PILOT_LIVE=1 — placing REAL limit orders against ${KALSHI_BASE_URL:-<code default: demo host>}"
            ./target/release/kalshi_pilot --live
          else
            ./target/release/kalshi_pilot
          fi

      - name: Render dashboard
        if: steps.guard.outputs.already != 'true'
        run: ./target/release/weather_dashboard --output dashboard.html

      - name: Commit data
        if: steps.guard.outputs.already != 'true'
        run: |
          git config user.name "daily-capture"
          git config user.email "actions@users.noreply.github.com"
          git add data/captures.jsonl dashboard.html
          if [ -f data/pilot_trades.jsonl ]; then
            git add data/pilot_trades.jsonl
          fi
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Daily capture $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
