name: daily-capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-favorite:
    name: Verify Favorite paper orders from main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8c0dfa287889c0d013459286a8b8f1fd419bfd7e
          persist-credentials: false

      - name: Build deployed pilot
        run: |
          git log -1 --oneline
          cargo build --locked --release --bin kalshi_pilot

      - name: Run Favorite on public quotes in paper mode
        run: |
          cp data/pilot_trades.jsonl "$RUNNER_TEMP/favorite-ledger.jsonl"
          prior_lines=$(wc -l < "$RUNNER_TEMP/favorite-ledger.jsonl")
          ./target/release/kalshi_pilot --strategy favorite --ledger "$RUNNER_TEMP/favorite-ledger.jsonl"
          python3 - "$RUNNER_TEMP/favorite-ledger.jsonl" "$prior_lines" <<'PY'
          import datetime
          import itertools
          import json
          import sys

          with open(sys.argv[1]) as ledger:
              rows = [json.loads(line) for line in itertools.islice(ledger, int(sys.argv[2]), None)]
          tomorrow = (datetime.datetime.now(datetime.timezone.utc).date()
                      + datetime.timedelta(days=1)).isoformat()
          next_day = [r for r in rows if r["target_date"] == tomorrow]
          orders = [r for r in rows if r["decision"] == "order"]
          assert next_day, "No next-day decisions recorded."
          assert orders, "No Favorite paper orders recorded."
          assert all(r["dry_run"] and r["strategy"] == "favorite" for r in rows)
          assert all(r["target_date"] == tomorrow for r in orders)
          print(f"Verified {len(next_day)} next-day decisions and {len(orders)} Favorite paper orders for {tomorrow}.")
          PY
