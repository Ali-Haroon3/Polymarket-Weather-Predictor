# Throwaway probe: the dev sandbox can't reach api.open-meteo.com, so candidate AI-model
# parameter names are verified from a runner that can. Dispatch-only; deleted after use.
name: model-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe candidate model strings
        run: |
          BASE="https://api.open-meteo.com/v1"
          Q="latitude=40.7789&longitude=-73.9692&start_date=$(date -u +%F)&end_date=$(date -u -d '+3 days' +%F)&timezone=UTC"
          for probe in \
            "forecast?daily=temperature_2m_max&models=ecmwf_aifs025_single" \
            "forecast?daily=temperature_2m_max&models=ecmwf_aifs025" \
            "forecast?daily=temperature_2m_max&models=gfs_graphcast025" \
            "forecast?hourly=temperature_2m&models=gfs_graphcast025" \
            "ecmwf?daily=temperature_2m_max&models=ecmwf_aifs025_single" \
            "gfs?daily=temperature_2m_max&models=gfs_graphcast025" \
          ; do
            echo "=== $probe ==="
            curl -sS "$BASE/$probe&$Q" | head -c 600 || true
            echo; echo
          done
